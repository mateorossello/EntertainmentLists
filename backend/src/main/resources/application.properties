#
# Spring Boot Configuration
#

spring.application.name=entertainment-lists

# Native support for .env files
spring.config.import=optional:file:backend/.env[.properties]

#
# Database Configuration
#

# ! ONLY FOR DEVELOPMENT
spring.datasource.url=jdbc:h2:mem:entertainment-lists
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ! ONLY FOR DEVELOPMENT
spring.datasource.username=admin
spring.datasource.password=admin

# ! ONLY FOR DEVELOPMENT
spring.jpa.show-sql=true
spring.h2.console.enabled=true

#
# Network Configuration
#

cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

#
# Secret Management
#

# ! ONLY FOR DEVELOPMENT
